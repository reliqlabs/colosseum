name: fv-ci

# What this workflow honestly gates:
#
# A stock GitHub runner has none of the verification toolchains (quint,
# apalache/JVM, kani, verus, lean, cargo-fuzz). So we DO NOT pretend to run
# the toolchain-dependent suites here. Two jobs:
#
#   gates      - toolchain-independent required checks, including Bun-based OMP
#                resolver and evidence-tool contracts.
#   regression - full suite. Exit 3 is tolerated only after the required core
#                runtime suites have passed separately.
#
# uv and Python are pinned per bom.json (uv 0.11.6, python >=3.11).

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gates:
    name: Toolchain-independent gates (required)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Bun (pinned)
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"
      - name: Install uv (pinned)
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.6"
      - name: Set up Python
        run: uv python install 3.12
      - name: Frontmatter / roster / links / dispatch / fixtures
        run: >-
          uv run --script scripts/ci.py
          --only frontmatter,roster-drift,doc-links,dispatch-config,fixture-tracking
      - name: OMP extension runtime contracts
        run: |
          uv run --script tests/r32_resolver_contract.py
          uv run --script tests/r34_evidence_run.py

  regression:
    name: Regression suite (toolchain-dependent tolerated)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Bun (pinned)
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"
      - name: Install uv (pinned)
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.6"
      - name: Set up Python
        run: uv python install 3.12
      - name: Run full regression suite (INCOMPLETE tolerated)
        run: |
          set +e
          uv run --script tests/run_all.py
          rc=$?
          set -e
          case "$rc" in
            0) exit 0 ;;
            3)
              echo "::warning::regression INCOMPLETE: proof toolchains absent on hosted runner"
              exit 0
              ;;
            *)
              echo "::error::regression suite exited $rc"
              exit "$rc"
              ;;
          esac
